name: Post Release Actions
permissions:
  contents: write

concurrency:
  group: post-release-${{ github.event.release.tag_name }}
  cancel-in-progress: true

on:
  release:
    types: [published]

jobs:
  update-release-tags:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.release.tag_name }}
      IS_PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Add nightly tag
        if: startsWith(env.TAG_NAME, 'v') && env.IS_PRERELEASE == 'true'
        shell: bash
        run: |
          git tag -f nightly
          git push -f origin nightly
      
      - name: Add stable tag
        if: startsWith(env.TAG_NAME, 'v') && env.IS_PRERELEASE == 'false'
        shell: bash
        run: |
          git tag -f stable
          git push -f origin stable