name: Dart

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        projects: [api, server, tools]
    defaults:
      run:
        working-directory: ${{ matrix.projects }}
    steps:
      - name: ⬆️ Checkout
        uses: actions/checkout@v6
      - name: Extract Dart SDK version from pubspec.yaml
        id: dart_version
        shell: bash
        run: |
          sdk_version=$(yq e '.environment.sdk' ../server/pubspec.yaml)
          sdk_version="${sdk_version#^}"  # Removes leading '^' if present
          echo "DART_SDK_VERSION=$sdk_version" >> $GITHUB_ENV
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}
      - name: Print Dart SDK version
        run: |
          dart --version
      - name: Install dependencies
        run: |
          dart pub get
      # Uncomment this step to verify the use of 'dart format' on each commit.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib
      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        run: |
          dart analyze --fatal-infos
      - name: Run build_runner
        if: matrix.projects != 'tools'
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Run format
        run: dart format .
      - name: Test for git changes
        run: git diff --exit-code
      - name: Run tests
        if: matrix.projects == 'server'
        run: |
          dart test --reporter=expanded
